<!DOCTYPE html>
<html lang="ja">
<head>

    :root {
      --bg-color: #0b0f19;
      --card-bg: #131c2e;
      --card-bg-gradient: linear-gradient(145deg, #162238, #101726);
      --accent-color: #ff5722;
      --accent-gold: #fbbf24;
      --text-color: #f3f4f6;
      --text-dim: #9ca3af;
      --border-color: #1e293b;
      --border-highlight: #334155;
      --success-color: #10b981;
      --rest-color: #3b82f6;
      --cyber-cyan: #00f0ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 14px;
      padding-bottom: 50px;
      line-height: 1.6;
    }

    .app-header {
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--card-bg-gradient);
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .app-header h1 {
      font-size: 1.1rem;
      background: linear-gradient(90deg, #ff7a45, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .header-btns { display: flex; gap: 6px; flex-wrap: wrap; }

    .menu-link-btn {
      background: #1e293b; border: 1px solid var(--border-highlight); color: var(--accent-gold);
      padding: 6px 10px; border-radius: 8px; font-size: 0.73rem; font-weight: bold; cursor: pointer; text-decoration: none;
    }

    .card {
      background: var(--card-bg-gradient); border-radius: 16px; padding: 18px; margin-bottom: 16px;
      border: 1px solid var(--border-color); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .card-title {
      font-size: 1.05rem; font-weight: 700; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); padding-bottom: 10px; color: #fff;
    }
